name: Research candidate collection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: salmon-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: research/collection_state.json
          key: salmon-state-v4-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            salmon-state-v4-
      - name: Collect candidates
        run: python3 scripts/collect.py
      - uses: actions/cache/save@v4
        if: always() && hashFiles('research/collection_state.json') != ''
        with:
          path: research/collection_state.json
          key: salmon-state-v4-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: salmon-research-review-candidates
          path: research/review_candidates.json
          if-no-files-found: error
      - name: Show research results
        run: |
          echo '## Research results' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat research/review_candidates.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
